# Publica el sitio en GitHub Pages con la acción oficial de Astro.
# https://docs.astro.build/en/guides/deploy/github/
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite publicar a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Revisar tipos, compilar y subir el sitio
        uses: withastro/action@v6
        with:
          build-cmd: npm run check && npm run build
        env:
          # Token general del panel /admin (usuario compartido AdminAlpina). Queda dentro del
          # JavaScript del panel publicado: solo debe tener acceso a este repositorio.
          # Sin el secret CMS_TOKEN, el usuario compartido entra en modo demostración.
          PUBLIC_GH_TOKEN: ${{ secrets.CMS_TOKEN }}

  # Publica en cada push a main y al ejecutar el flujo a mano (Run workflow)
  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
